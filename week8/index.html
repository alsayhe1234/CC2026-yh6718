<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Sound of Silence</title>

   <script src="p5.js"></script>
  <script src="p5.sound.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f3ee;
      color: #303b36;
      margin: 30px;
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      line-height: 1.6;
    }

    button {
      padding: 10px 18px;
      margin: 10px 0 20px;
      cursor: pointer;
    }

    #week8-sketch {
      width: 500px;
      max-width: 100%;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto !important;
    }
  </style>
</head>

<body>
  <h1>The Sound of Silence</h1>

  <p>
    A little bird reacts to the sounds around it.
    The louder you are, the louder it screams.
    If the environment becomes too noisy, it flies away.
    Stay quiet, and it will return.
  </p>

  <button id="mic-button">Enable Microphone</button>

  <div id="week8-sketch"></div>

  <p id="status">Click Enable Microphone to begin.</p>

  <script src="sketch.js"></script>
</body>
</html>
